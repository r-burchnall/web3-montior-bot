receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  # Map OTel resource attributes into Loki labels for filtering
  resource:
    attributes:
      - action: insert
        key: loki.resource.labels
        value: service.name, developer.name, deployment.environment, service.instance.id, run.id
  # Drop DEBUG/INFO logs from prod to avoid overwhelming Loki.
  # Prod bots write full logs to local files anyway.
  filter/prod-logs:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["deployment.environment"] == "prod" and severity_number < 9'

exporters:
  # Traces -> Tempo (internal Docker network)
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Logs -> Loki (OTLP HTTP ingestion)
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"

  # Metrics -> Prometheus scrape endpoint
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: arbitrage

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]

    logs:
      receivers: [otlp]
      processors: [filter/prod-logs, batch, resource]
      exporters: [otlphttp/loki]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
